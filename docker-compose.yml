x-app: &app
  build: .
  image: py-pilates:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pilates
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pilates}   # en .env; tiene que coincidir con DATABASE_URL
      POSTGRES_DB: pilates
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # sólo desde esta máquina (tests y psql); los contenedores usan la red interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilates -d pilates"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"   # UI de los correos, sólo desde esta máquina: muestra los links de reset
    restart: unless-stopped

  api:
    <<: *app
    command: ["api"]
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}   # procesos de uvicorn (uno por núcleo)
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}   # false para pruebas de carga
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      api:
        condition: service_healthy

  beat:
    <<: *app
    command: ["beat"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
